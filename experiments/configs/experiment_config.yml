# LLM-Needs-a-Plan Experiment Configuration
# This file defines systematic experiments for comparing models on planning tasks

# Global Configuration
global:
  cluster:
    partition: "boost_usr_prod"
    account: "cin_staff"
    time_limit: "02:00:00"
    nodes: 1
    cpus: 32
    memory: "256GB"
    
  paths:
    base_dir: "/leonardo_work/Pra24_5520/aless/LLM-Needs-a-Plan"
    results_dir: "/leonardo_work/Pra24_5520/aless/LLM-Needs-a-Plan/experiments/results"
    logs_dir: "/leonardo_work/Pra24_5520/aless/LLM-Needs-a-Plan/experiments/logs"
    problems_dir: "/leonardo_work/Pra24_5520/aless/LLM-Needs-a-Plan/src/problems"

# Model Configuration
models:
  phi4:
    name: "Phi4"
    path: "src/models/Phi4"
    size: "14B"
    gpus: 1
    memory_per_gpu: "40GB"
    priority: 1
    generation_config:
      temperature: 0.1
      max_new_tokens: 2048
      do_sample: true
      
  llama4:
    name: "Llama4" 
    path: "src/models/Llama4"
    size: "107B"
    gpus: 4
    memory_per_gpu: "80GB"
    priority: 2
    generation_config:
      temperature: 0.1
      max_new_tokens: 2048
      do_sample: true

# Domain Configuration
domains:
  tetris:
    name: "Tetris"
    domain_file: "tetris-domain.pddl"
    problems:
      - "tetris01.pddl"
      - "tetris02.pddl"
      - "tetris03.pddl"
      - "tetris04.pddl"
      - "tetris05.pddl"
    complexity: "medium"
    
  logistics:
    name: "Logistics"
    domain_file: "logistics-domain.pddl" 
    problems:
      - "logistics01.pddl"
      - "logistics02.pddl"
      - "logistics03.pddl"
    complexity: "high"
    
  blocks:
    name: "Blocks World"
    domain_file: "blocks-domain.pddl"
    problems:
      - "blocks01.pddl" 
      - "blocks02.pddl"
      - "blocks03.pddl"
    complexity: "low"

# Experiment Sets
experiment_sets:
  quick_test:
    description: "Quick validation test with single model and domain"
    models: ["phi4"]
    domains: ["tetris"]
    problem_limit: 2
    priority: 1
    
  model_comparison:
    description: "Compare Phi4 vs Llama4 on same problems"
    models: ["phi4", "llama4"]
    domains: ["tetris", "blocks"]
    problem_limit: 3
    priority: 2
    
  domain_analysis:
    description: "Full domain coverage with best model"
    models: ["phi4"]
    domains: ["tetris", "logistics", "blocks"]
    problem_limit: null  # All problems
    priority: 3
    
  comprehensive:
    description: "Full comparison matrix - all models on all domains"
    models: ["phi4", "llama4"]
    domains: ["tetris", "logistics", "blocks"]
    problem_limit: null
    priority: 4

# Experiment Execution Configuration
execution:
  concurrent_jobs: 4
  retry_failed: true
  max_retries: 2
  validation_enabled: true
  save_intermediate: true
  
# Output Configuration
output:
  formats: ["json", "csv", "summary"]
  metrics:
    - "plan_validity"
    - "plan_length" 
    - "generation_time"
    - "memory_usage"
    - "success_rate"
  visualization:
    - "success_by_model"
    - "performance_by_domain"
    - "resource_utilization"